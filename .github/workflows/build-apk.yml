name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip QurilishNazorati_Android_READY.zip -d project
          find project -maxdepth 3 -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project/QurilishNazorati_Android_READY
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QurilishNazorati-APK
          path: project/QurilishNazorati_Android_READY/app/build/outputs/apk/debug/app-debug.apk
